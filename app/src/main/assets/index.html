<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LG Remote">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LG Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505; --card:#131313; --card2:#1b1b1b; --line:#222222;
  --text:#f5f5f5; --muted:#8e8e8e; --faint:#5c5c5c;
  --green:#31c85d; --amber:#f0b429; --red:#f0524f; --sel:#25262c;
  --ease:cubic-bezier(.2,.8,.2,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;overscroll-behavior:none}
body{display:flex;justify-content:center;color:var(--text);font-family:var(--font);font-size:16px;line-height:1.3;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.011em}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
h1,h2,p{margin:0}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

/* ---------- App shell ---------- */
.app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--bg);overflow:hidden}
@media (min-width:600px){
  body{align-items:center}
  .app{height:min(calc(100dvh - 32px),900px);border-radius:44px;box-shadow:0 0 0 1px #1d1d1d}
}
.screen{position:absolute;inset:0;display:none;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:max(22px,env(safe-area-inset-top)) 20px calc(104px + env(safe-area-inset-bottom))}
.screen.notab{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.screen.active{display:block;animation:in .22s var(--ease)}
@keyframes in{from{opacity:0}to{opacity:1}}
.pr{transition:transform .15s var(--ease),background-color .18s var(--ease),opacity .18s var(--ease)}
.pr:active{transform:scale(.96)}
.ctl{transition:opacity .25s var(--ease)}
.app.disc .ctl{opacity:.38;pointer-events:none}

.top{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.ttl{font-size:28px;font-weight:500;letter-spacing:-.025em}
.ttl.sm{font-size:24px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:#f0f0f0;margin-right:-8px}
.iconbtn:active{background:#161616}
.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.gdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5b5b5b;flex:none;transition:background-color .25s var(--ease)}
.gdot.on{background:var(--green)}
.gdot.wait{background:var(--amber)}
.gdot.err{background:var(--red)}

/* ---------- Buttons / fields ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border-radius:18px;
  background:#f3f3f3;color:#111;font-size:17px;font-weight:500}
.btn:active{transform:scale(.98)}
.btn.sec{background:#1d1d1d;color:#fff}
.btn.danger{background:#1d1d1d;color:var(--red)}
.btn.sm{width:auto;height:46px;padding:0 20px;border-radius:14px;font-size:16px}
.fld{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.fld input{flex:1;min-width:0;height:48px;padding:0 14px;border-radius:14px;border:1px solid #272727;background:#1a1a1a;color:#fff;font-size:16px;outline:0;
  transition:border-color .18s var(--ease)}
.fld input:focus{border-color:#5a5a5a}
.fld input::placeholder{color:#5f5f5f}
.suffix{color:var(--muted);font-size:15px;white-space:nowrap}
.lab{display:block;color:var(--muted);font-size:13px;margin:0 2px 8px}
.empty{color:var(--muted);font-size:15px;padding:14px 4px}

/* ---------- Welcome ---------- */
.wbg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wc{position:relative;min-height:100%;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:14px;margin-top:clamp(70px,22vh,190px)}
.logo svg{width:68px;height:68px;flex:none}
.logo .lg{font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1}
.logo .wo{font-size:32px;font-weight:300;color:#9b9b9b;letter-spacing:-.02em;line-height:1.05;margin-top:4px}
.hero{margin-top:clamp(56px,14vh,120px);font-size:34px;font-weight:300;line-height:1.18;letter-spacing:-.03em}
.tag{margin-top:14px;font-size:18px;color:#a3a3a3;font-weight:300}
.wc .sp{flex:1;min-height:40px}
.learn{display:flex;align-items:center;justify-content:center;gap:8px;margin:20px auto 6px;color:#a3a3a3;font-size:15px;text-decoration:underline;text-underline-offset:3px}
.learn svg{width:16px;height:16px}

/* ---------- Select TV ---------- */
.tvrow{display:flex;align-items:center;gap:16px;width:100%;padding:18px 16px;border-radius:22px;background:var(--card);margin-bottom:12px;text-align:left;
  box-shadow:inset 0 0 0 1px #1c1c1c}
.tvrow.sel{background:var(--sel);box-shadow:inset 0 0 0 1px #2d2e35}
.tvrow .tvi{width:36px;height:36px;stroke-width:1.3;color:#dcdcdc}
.tvrow .tm{flex:1;min-width:0}
.tvn{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:500}
.tvn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{width:9px;height:9px;border-radius:50%;border:1.5px solid #d2d2d2;flex:none}
.tvr{display:flex;align-items:center;gap:8px;margin-top:5px;color:var(--muted);font-size:15px}
.tvr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvr.err span{color:var(--red)}
.tvrow .tail{color:#6b6b6b;width:22px;height:22px}
.tvrow.sel .tail{color:#fff}
.scan{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;margin-top:6px;border-radius:22px;background:var(--card);
  box-shadow:inset 0 0 0 1px #1c1c1c;font-size:16px}
.scan svg{width:22px;height:22px}
.hint{margin:14px 4px 0;color:var(--faint);font-size:13px;text-align:center}

/* ---------- Remote ---------- */
.rhead{display:flex;align-items:flex-start;gap:14px;cursor:pointer}
.tvico{width:46px;height:46px;stroke-width:1.3;color:#dcdcdc;margin-top:2px}
.rmeta{min-width:0;flex:1}
.tvname{font-size:21px;font-weight:500;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvroom{color:#a6a6a6;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvstate{display:flex;align-items:center;gap:8px;margin-top:7px;color:#a6a6a6;font-size:15px}
.pwr{width:50px;height:50px;border-radius:50%;background:#181818;display:grid;place-items:center;color:#f2f2f2;box-shadow:inset 0 0 0 1px #232323;flex:none}
.dialwrap{display:grid;place-items:center;margin:22px 0 22px}
.dial{position:relative;width:min(60vw,244px,34dvh);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 50% 28%,#232323 0%,#161616 62%,#111 100%);
  box-shadow:inset 0 0 0 1px #272727,inset 0 14px 32px rgba(255,255,255,.025)}
.dbtn{position:absolute;width:56px;height:56px;display:grid;place-items:center;border-radius:50%;color:#d6d6d6;transition:background-color .15s var(--ease),color .15s var(--ease)}
.dbtn:active{background:rgba(255,255,255,.08);color:#fff}
.dbtn svg{width:26px;height:26px}
.dbtn.u{left:50%;top:3%;margin-left:-28px}
.dbtn.d{left:50%;bottom:3%;margin-left:-28px}
.dbtn.l{top:50%;left:3%;margin-top:-28px}
.dbtn.r{top:50%;right:3%;margin-top:-28px}
.okb{position:absolute;left:50%;top:50%;width:36%;aspect-ratio:1;margin:-18% 0 0 -18%;border-radius:50%;background:#101010;
  box-shadow:inset 0 0 0 1px #262626;font-size:22px;font-weight:300;letter-spacing:.01em;color:#f2f2f2;transition:background-color .15s var(--ease)}
.okb:active{background:#1c1c1c}
.rbtns{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:20px}
.rb{display:flex;flex-direction:column;align-items:center;gap:9px;color:#c8c8c8;font-size:14px}
.rb .c{width:64px;height:64px;border-radius:50%;background:#171717;box-shadow:inset 0 0 0 1px #262626;display:grid;place-items:center;color:#f2f2f2;
  transition:background-color .15s var(--ease)}
.rb:active .c{background:#222}
.rb .c svg{width:27px;height:27px}
.pill{display:flex;align-items:center;gap:12px;height:64px;padding:0 14px;margin-bottom:12px;border-radius:22px;background:#111;box-shadow:inset 0 0 0 1px #1f1f1f}
.pill .ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:#ececec;flex:none;transition:background-color .15s var(--ease)}
.pill .ib:active{background:#1d1d1d}
.pill.chp{height:60px;justify-content:space-between;padding:0 16px}
.chc{width:46px;height:46px;border-radius:50%;background:#1b1b1b;font-size:15px;display:grid;place-items:center;color:#e8e8e8}

input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:32px;margin:0;background:transparent;cursor:pointer;--p:50%}
input[type=range]:focus-visible{outline-offset:4px}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,#f3f3f3 var(--p),#3a3a3a var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#3a3a3a}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:#f3f3f3}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 6px rgba(0,0,0,.5)}

/* ---------- Apps ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:space-between;aspect-ratio:1/1.12;padding:14px 4px 12px;border-radius:20px;
  background:#151515;box-shadow:inset 0 0 0 1px #1d1d1d;color:#d8d8d8;font-size:13px;overflow:hidden}
.tile .art{flex:1;display:grid;place-items:center}
.tile.t-prime{background:linear-gradient(180deg,#0f1c2e,#0b1320)}
.tile.t-disney{background:linear-gradient(180deg,#0f2d66,#0a1c42)}
.tile.na{opacity:.42}
.art.mono{font-size:26px;font-weight:600;color:#cfcfcf;width:46px;height:46px;border-radius:14px;background:#222;display:grid;place-items:center}
.recent{margin-top:14px;padding:16px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 1px #1c1c1c}
.rh{display:flex;align-items:center;justify-content:space-between;font-size:17px;font-weight:500}
.rh button{display:flex;align-items:center;gap:6px;color:#9a9a9a;font-size:13px;font-weight:400;padding:6px 0 6px 10px}
.rh button svg{width:15px;height:15px}
.rrow{display:flex;align-items:center;gap:14px;margin-top:14px}
.thumb{width:86px;height:58px;border-radius:12px;background:#1d1d1d;display:grid;place-items:center;overflow:hidden;flex:none}
.rt{flex:1;min-width:0}
.rt b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt span{color:var(--muted);font-size:14px}
.rplay{width:46px;height:46px;border-radius:50%;background:#232323;display:grid;place-items:center;flex:none}
.rplay svg{width:18px;height:18px}

/* ---------- Media ---------- */
.now{display:flex;gap:16px;align-items:center;margin-top:18px;padding:14px;border-radius:22px;background:#151515;box-shadow:inset 0 0 0 1px #1d1d1d}
.now .thumb{width:104px;height:78px}
.now b{display:block;font-size:20px;font-weight:500;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now span{display:block;color:#b0b0b0;font-size:15px;margin-top:3px}
.nowt{min-width:0}
.mc{display:flex;align-items:center;justify-content:center;gap:34px;margin:30px 0 26px}
.mc .sm{width:60px;height:60px;display:grid;place-items:center;color:#f3f3f3;border-radius:50%}
.mc .sm svg{width:34px;height:34px}
.mc .big{width:88px;height:88px;border-radius:50%;background:#1b1b1b;display:grid;place-items:center;color:#f3f3f3}
.mc .big svg{width:36px;height:36px}
.mtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;height:76px;border-radius:18px;background:#151515;color:#cfcfcf;font-size:14px;
  box-shadow:inset 0 0 0 1px #1d1d1d}
.mt.on{background:var(--sel);color:#fff}
.mt svg{width:26px;height:26px}
.speed{display:flex;align-items:center;justify-content:space-between;width:100%;height:56px;margin-top:12px;padding:0 16px;border-radius:16px;background:var(--card);
  box-shadow:inset 0 0 0 1px #1c1c1c;font-size:15px;text-align:left}
.speed span{display:flex;align-items:center;gap:8px;color:#d0d0d0}
.speed svg{width:18px;height:18px;color:#8a8a8a}

/* ---------- Settings ---------- */
.group{border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 1px #1c1c1c;overflow:hidden;margin-bottom:12px}
.srow{display:flex;align-items:center;gap:16px;width:100%;padding:16px;text-align:left}
.srow+.srow{border-top:1px solid #1f1f1f}
.srow:active{background:#191919}
.srow .lead{width:28px;height:28px;color:#d6d6d6;stroke-width:1.4}
.srow .st{flex:1;min-width:0}
.srow b{display:block;font-weight:500;font-size:17px}
.srow small{display:block;margin-top:2px;color:var(--muted);font-size:14px}
.srow .tail{width:20px;height:20px;color:#6b6b6b}
.srow.danger{color:var(--red)}
.srow.danger .lead{color:var(--red)}
.srow.danger b{font-weight:400}
.srow.plain .st small{margin-top:0}

/* ---------- Tab bar ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:none;grid-template-columns:repeat(4,1fr);
  padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:#090909;border-top:1px solid #1a1a1a}
.tabbar.show{display:grid}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0;color:#767676;font-size:12px;transition:color .18s var(--ease)}
.tab svg{width:26px;height:26px}
.tab.on{color:#fff}
.tab .fl{display:none}
.tab.on .fl{display:block}
.tab.on .ol.swap{display:none}

/* ---------- Sheets ---------- */
.sheetwrap{position:absolute;inset:0;z-index:40;display:none}
.sheetwrap.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.62);animation:in .2s var(--ease)}
.sheetpanel{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  background:#121212;border-radius:28px 28px 0 0;box-shadow:0 -1px 0 #232323;animation:rise .3s var(--ease)}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:#3a3a3a;margin:0 auto 18px}
.sheetpanel h2{font-size:22px;font-weight:500;letter-spacing:-.02em;margin-bottom:6px}
.sheetpanel .sub{color:var(--muted);font-size:15px;margin-bottom:18px}
.sheetpanel .btn+.btn{margin-top:10px}
.steps{margin:6px 0 22px;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:0 0 14px 38px;color:#cfcfcf;font-size:15px;line-height:1.4;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;background:#222;display:grid;place-items:center;font-size:13px;color:#fff}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;text-align:left}
.row+.row{border-top:1px solid #1f1f1f}
.row .st{flex:1;min-width:0}
.row b{display:block;font-weight:500;font-size:16px}
.row small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.row .val{color:#bdbdbd;font-size:15px;text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch{width:48px;height:29px;border-radius:15px;background:#3a3a3c;position:relative;flex:none;transition:background-color .2s var(--ease)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(19px)}
.seg{display:flex;padding:3px;border-radius:12px;background:#1a1a1a;margin-bottom:16px}
.seg button{flex:1;height:36px;border-radius:9px;color:var(--muted);font-size:15px;transition:background-color .18s var(--ease),color .18s var(--ease)}
.seg button.on{background:#2c2c2c;color:#fff}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.keys button{height:58px;border-radius:18px;background:#1b1b1b;font-size:24px;font-weight:400;transition:background-color .15s var(--ease)}
.keys button:active{background:#2a2a2a}
.keys button.mut{color:#9a9a9a}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.mgrid button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:72px;border-radius:18px;background:#1b1b1b;font-size:14px;color:#d0d0d0}
.mgrid button:active{background:#2a2a2a}
.mgrid svg{width:24px;height:24px}
.cdot{width:14px;height:14px;border-radius:50%}
.prog{height:3px;border-radius:2px;background:#222;margin:14px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#f3f3f3;transition:width .2s linear}
.found{margin:6px 0 18px}
.sheetpanel h3{margin:6px 0 4px;font-size:13px;font-weight:500;color:var(--muted)}

/* ---------- Search ---------- */
#s-search{z-index:30;background:var(--bg);padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.sbar{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.sbar input{flex:1;min-width:0;height:46px;padding:0 16px;border-radius:14px;border:0;background:#161616;color:#fff;font-size:16px;outline:0}
.sbar input::placeholder{color:#666}
.sres{display:block;width:100%;text-align:left}
.sitem{display:flex;align-items:center;gap:14px;width:100%;padding:10px 4px;text-align:left}
.sitem+.sitem{border-top:1px solid #1b1b1b}
.sitem:active{background:#121212}
.sitem .thumb{width:48px;height:48px;border-radius:12px}
.sitem .thumb .art svg{transform:scale(.55)}
.sitem span{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Toast ---------- */
.toast{position:absolute;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));z-index:60;max-width:calc(100% - 40px);padding:11px 18px;border-radius:999px;
  background:#2a2a2a;color:#f2f2f2;font-size:14px;text-align:center;opacity:0;transform:translate(-50%,8px);pointer-events:none;
  transition:opacity .22s var(--ease),transform .22s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false"><defs>

/* ---------- Connection (SSAP over WebSocket) ---------- */
const PERMS = ['LAUNCH','LAUNCH_WEBAPP','APP_TO_APP','CLOSE','TEST_OPEN','TEST_PROTECTED','CONTROL_AUDIO','CONTROL_DISPLAY',
  'CONTROL_INPUT_JOYSTICK','CONTROL_INPUT_MEDIA_RECORDING','CONTROL_INPUT_MEDIA_PLAYBACK','CONTROL_INPUT_TV','CONTROL_POWER',
  'CONTROL_INPUT_TEXT','CONTROL_MOUSE_AND_KEYBOARD','READ_APP_STATUS','READ_CURRENT_CHANNEL','READ_INPUT_DEVICE_LIST',
  'READ_NETWORK_STATE','READ_RUNNING_APPS','READ_TV_CHANNEL_LIST','READ_INSTALLED_APPS','READ_POWER_STATE','READ_COUNTRY_INFO',
  'READ_SETTINGS','WRITE_NOTIFICATION_TOAST'];

function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function req(uri, payload, cb) {
  const id = 'r' + (++n);
  if (cb) pending[id] = cb;
  send({ type: 'request', id, uri, payload: payload || {} });
}
function sub(uri, payload, cb) {
  const id = 's' + (++n);
  subs[id] = cb;
  send({ type: 'subscribe', id, uri, payload: payload || {} });
}
function teardown() {
  attempt++;
  try { ws && ws.close(); } catch (e) {}
  try { ptr && ptr.close(); } catch (e) {}
  ws = ptr = null; ptrBusy = false; queue.length = 0;
  pending = {}; subs = {};
  connected = false; appsList = []; inputsList = []; fg = ''; sysInfo = null; sw = null;
}
function disconnect() {
  teardown(); cur = null;
  setStatus('off', 'Not connected');
  renderAll();
}
function connectTV(tv) {
  teardown(); cur = tv; S.sel = tv.id; save();
  const me = ++attempt;
  setStatus('wait', 'Connecting…');
  renderHead();
  openSock('ws://' + tv.ip + ':3000', me, () => {
    if (me !== attempt) return;
    openSock('wss://' + tv.ip + ':3001', me, () => {
      if (me !== attempt) return;
      const why = window.__lgLastWsError ? ' (' + window.__lgLastWsError + ')' : '';
      setStatus('err', window.LGBridge
        ? 'Can’t reach the TV' + why + '. Check it is on, on the same Wi‑Fi, and LG Connect Apps is enabled.'
        : (location.protocol === 'https:'
          ? 'Can’t reach the TV from an https page'
          : 'Can’t reach the TV. Same Wi‑Fi?'));
    });
  });
}
function openSock(url, me, onFail) {
  let opened = false, sock;
  try { sock = new WebSocket(url); } catch (e) { onFail(); return; }
  const timer = setTimeout(() => { if (!opened) { try { sock.close(); } catch (e) {} } }, 4500);
  sock.onopen = () => {
    opened = true; clearTimeout(timer);
    if (me !== attempt) { sock.close(); return; }
    ws = sock; register();
  };
  sock.onerror = () => {};
  sock.onclose = () => {
    clearTimeout(timer);
    if (!opened) { onFail(); return; }
    if (me === attempt && ws === sock) {
      connected = false; ws = null;
      setStatus('err', 'Connection lost');
      renderAll();
    }
  };
  sock.onmessage = e => { if (me === attempt) onMsg(e); };
}
function register() {
  const key = cur && cur.key;
  const payload = {
    forcePairing: false, pairingType: 'PROMPT',
    manifest: {
      manifestVersion: 1, appVersion: '1.0', permissions: PERMS,
      signed: { created: '20240101', appId: 'com.example.minimalremote', vendorId: 'com.example',
        localizedAppNames: { '': 'Minimal Remote' }, localizedVendorNames: { '': 'Minimal' },
        permissions: PERMS, serial: 'minimalremote0001' }
    }
  };
  if (key) payload['client-key'] = key;
  send({ type: 'register', id: 'register_0', payload });
  setStatus('wait', key ? 'Signing in…' : 'Accept the prompt on your TV');
}
function onMsg(e) {
  let m; try { m = JSON.parse(e.data); } catch (_) { return; }
  if (m.type === 'registered') {
    if (cur && m.payload && m.payload['client-key']) cur.key = m.payload['client-key'];
    connected = true; S.auto = true; save();
    setStatus('on', 'Connected');
    openPointer(); loadAll(); renderAll();
    if (screen === 'select' || screen === 'welcome') go('remote');
  } else if (m.type === 'error') {
    if (m.id === 'register_0') {
      if (cur) cur.key = ''; save();
      setStatus('err', 'Pairing failed');
    }
    delete pending[m.id];
  } else if (m.id && subs[m.id]) {
    subs[m.id](m.payload || {});
  } else if (m.id && pending[m.id]) {
    const cb = pending[m.id]; delete pending[m.id];
    cb(m.payload || {});
  }
}
function loadAll() {
  req('ssap://com.webos.applicationManager/listLaunchPoints', {}, p => {
    appsList = (p.launchPoints || []).map(a => ({ id: a.id, title: a.title || a.id }));
    renderApps(); renderMedia();
  });
  req('ssap://tv/getExternalInputList', {}, p => {
    inputsList = (p.devices || []).map(d => ({ id: d.id, label: d.label || d.id }));
  });
  sub('ssap://audio/getVolume', {}, p => {
    const vs = p.volumeStatus || p;
    const v = typeof vs.volume === 'number' ? vs.volume : p.volume;
    const m = vs.muteStatus !== undefined ? vs.muteStatus : (vs.muted !== undefined ? vs.muted : p.muted);
    if (typeof v === 'number') { vol.v = v; if (!dragging) setSlider(v); }
    if (typeof m === 'boolean') { vol.muted = m; renderAudio(); }
  });
  sub('ssap://com.webos.applicationManager/getForegroundAppInfo', {}, p => { fg = p.appId || ''; renderMedia(); });
  req('ssap://com.webos.service.tv.systemproperty/getSystemInfo', { keys: ['modelName', 'firmwareVersion', 'sdkVersion'] }, p => {
    sysInfo = p;
    if (p.modelName && cur) { cur.model = p.modelName; save(); renderHead(); renderSelect(); }
  });
  req('ssap://com.webos.service.update/getCurrentSWInformation', {}, p => { sw = p; });
}

/* Pointer socket: remote-control key presses */
function sendKey(name) { ptr.send('type:button\nname:' + name + '\n\n'); }
function openPointer() {
  if (ptrBusy) return;
  ptrBusy = true; setTimeout(() => { ptrBusy = false; }, 3000);
  req('ssap://com.webos.service.networkinput/getPointerInputSocket', {}, p => {
    ptrBusy = false;
    if (!p.socketPath) return;
    try {
      const sock = new WebSocket(p.socketPath);
      ptr = sock;
      sock.onopen = () => { queue.splice(0).forEach(sendKey); };
      sock.onclose = () => { if (ptr === sock) ptr = null; };
    } catch (e) { ptr = null; }
  });
}
function pressButton(name) {
  if (ptr && ptr.readyState === 1) sendKey(name);
  else { queue.push(name); if (!ptr || ptr.readyState > 1) openPointer(); }
}

function probe(ip, ms) {
  return new Promise(res => {
    let s, t, fin = false;
    const end = v => { if (fin) return; fin = true; clearTimeout(t); try { s && s.close(); } catch (e) {} res(v); };
    try { s = new WebSocket('ws://' + ip + ':3000'); } catch (e) { return end(false); }
    s.onopen = () => end(true); s.onerror = () => end(false); s.onclose = () => end(false);
    t = setTimeout(() => end(false), ms);
  });
}

function remoteSheet() {

  const row = (k, t, s) => '<button class="row" data-pref="' + k + '"><span class="st"><b>' + t + '</b><small>' + s + '</small></span><i class="switch' + (S.prefs[k] ? ' on' : '') + '"></i></button>';

        r.querySelector('.switch').classList.toggle('on', S.prefs[k]);
      });
      const ed = b.querySelector('#rsEdit'); if (ed) ed.onclick = () => tvEditSheet(tv);
    });
}

function aboutSheet() {
  const tv = viewTV();
  const model = (sysInfo && sysInfo.modelName) || (tv && tv.model) || (sw && sw.model_name) || '—';
  const ver = sw && sw.major_ver !== undefined ? [sw.major_ver, sw.minor_ver, sw.dot_ver].filter(x => x !== undefined && x !== '').join('.') : '';
  const soft = (sysInfo && sysInfo.firmwareVersion) || ver || '—';
  const r = (k, v) => '<div class="row"><span class="st"><b>' + k + '</b></span><span class="val">' + esc(v) + '</span></div>';
  sheet('<h2>About This App</h2><p class="sub">An ad-free remote for LG webOS TVs.</p>' +
    r('App version', '1.0.0') + r('TV model', model) + r('TV software', soft) + r('TV address', tv ? tv.ip : '—') +
    '<button class="row" id="abPing"><span class="st"><b>Send test message to TV</b><small>Shows a short notification on screen</small></span></button>',
    b => b.querySelector('#abPing').onclick = () => {
      if (!connected) return toast('Not connected to a TV');
      req('ssap://system.notifications/createToast', { message: 'Remote connected ✓' });
    });
}

function inputSheet() {
  const keys = ['1','2','3','4','5','6','7','8','9','–','0','*'];
  const nm = { '–': 'DASH', '*': 'ASTERISK' };
  sheet('<div class="seg"><button class="on" data-seg="num">Numbers</button><button data-seg="txt">Keyboard</button></div>' +
    '<div id="segNum"><div class="keys">' + keys.map(k => '<button class="' + (nm[k] ? 'mut' : '') + '" data-btn="' + (nm[k] || k) + '">' + k + '</button>').join('') +
    '</div><button class="btn sec" data-btn="ENTER">Enter</button></div>' +
    '<div id="segTxt" hidden><label class="lab" for="kbIn">Send text to the TV</label><div class="fld"><input id="kbIn" placeholder="192.168.101.72" autocomplete="off"><button class="btn sm" id="kbSend">Send</button></div>' +
    '<div class="mgrid" style="grid-template-columns:1fr 1fr"><button id="kbDel">Delete</button><button id="kbEnt">Enter</button></div></div>',
    b => {
      b.querySelectorAll('[data-seg]').forEach(s => s.onclick = () => {
        b.querySelectorAll('[data-seg]').forEach(x => x.classList.toggle('on', x === s));
        b.querySelector('#segNum').hidden = s.dataset.seg !== 'num';
        b.querySelector('#segTxt').hidden = s.dataset.seg !== 'txt';
        if (s.dataset.seg === 'txt') b.querySelector('#kbIn').focus();
      });
      const inp = b.querySelector('#kbIn');
      const sendText = () => { const v = inp.value; if (!v || !connected) return; req('ssap://com.webos.service.ime/insertText', { text: v, replace: 0 }); inp.value = ''; };
      b.querySelector('#kbSend').onclick = sendText;
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendText(); if (connected) req('ssap://com.webos.service.ime/sendEnterKey'); } });
      b.querySelector('#kbDel').onclick = () => connected && req('ssap://com.webos.service.ime/deleteCharacters', { count: 1 });
      b.querySelector('#kbEnt').onclick = () => connected && req('ssap://com.webos.service.ime/sendEnterKey');
    });
}

function moreSheet() {
  const col = (n, c) => '<button data-btn="' + n + '"><i class="cdot" style="background:' + c + '"></i>' + n.charAt(0) + n.slice(1).toLowerCase() + '</button>';
  sheet('<h2>More controls</h2><p class="sub">Extra keys for the current screen.</p>' +
    '<div class="mgrid"><button data-uri="ssap://media.controls/stop">' + ic('stop') + 'Stop</button><button data-btn="INFO">' + ic('info') + 'Info</button><button data-btn="EXIT">' + ic('close') + 'Exit</button></div>' +
    '<div class="mgrid">' + col('RED', '#e5484d') + col('GREEN', '#31c85d') + col('YELLOW', '#f0b429') + '</div>' +
    '<div class="mgrid" style="grid-template-columns:1fr">' + col('BLUE', '#3b82f6') + '</div>' +
    (inputsList.length ? '<h3>Inputs</h3><div id="mIn">' + inputsList.map(i => '<button class="row" data-input="' + esc(i.id) + '"><span class="st"><b>' + esc(i.label) + '</b></span></button>').join('') + '</div>' : ''),
    b => b.querySelectorAll('[data-input]').forEach(x => x.onclick = () => { req('ssap://tv/switchInput', { inputId: x.dataset.input }); closeSheet(); }));
}

function recentSheet() {
  sheet('<h2>Recent</h2><p class="sub">Apps you opened with this remote.</p>' +
    S.recent.map(r => '<button class="sitem" data-id="' + esc(r.id) + '" data-title="' + esc(r.title) + '"><span class="thumb">' + artFor(r.title) + '</span><span>' + esc(r.title) + '</span><small style="color:#777">' + esc(ago(r.t)) + '</small></button>').join(''),
    b => b.querySelectorAll('.sitem').forEach(x => x.onclick = () => { launch(x.dataset.id, x.dataset.title); closeSheet(); }));
}

function tvEditSheet(tv) {
  if (!tv) return;
  sheet('<h2>' + esc(tvName(tv)) + '</h2><p class="sub">' + esc(tv.ip) + '</p>' +
    '<label class="lab" for="eName">Name</label><div class="fld"><input id="eName" value="' + esc(tv.name || '') + '" placeholder="' + esc(tv.model || 'LG TV') + '" maxlength="32"></div>' +
    '<label class="lab" for="eRoom">Room</label><div class="fld"><input id="eRoom" value="' + esc(tv.room || '') + '" placeholder="Living Room" maxlength="32"></div>' +
    '<button class="btn" id="eSave">Save</button><button class="btn danger" id="eDel">Remove TV</button>',
    b => {
      b.querySelector('#eSave').onclick = () => {
        tv.name = b.querySelector('#eName').value.trim(); tv.room = b.querySelector('#eRoom').value.trim();
        save(); closeSheet(); renderAll();
      };
      b.querySelector('#eDel').onclick = () => {
        if (cur && cur.id === tv.id) disconnect();
        S.tvs = S.tvs.filter(t => t !== tv);
        if (S.sel === tv.id) { S.sel = null; S.auto = false; }
        save(); closeSheet(); renderAll();
      };
    });
}

/* ---------- Add / scan ---------- */
let scanToken = 0;
const validIP = ip => /^\d{1,3}(\.\d{1,3}){3}$/.test(ip) && ip.split('.').every(x => +x <= 255);
function addTV(ip) {
  let tv = S.tvs.find(t => t.ip === ip);
  if (!tv) { tv = { id: uid(), ip, name: '', room: '', model: '', key: '' }; S.tvs.push(tv); save(); }
  closeSheet(); renderSelect(); connectTV(tv);
}
function scanSheet() {
  const seed = S.tvs[0] ? S.tvs[0].ip.split('.').slice(0, 3).join('.') : '192.168.1';
  sheet('<h2>Add a TV</h2><p class="sub">Scan your Wi‑Fi for LG TVs, or add one by its IP address.</p>' +
    '<label class="lab" for="scBase">Network</label><div class="fld"><input id="scBase" value="' + esc(seed) + '" inputmode="decimal" spellcheck="false" autocomplete="off"><span class="suffix">.1 – .254</span></div>' +
    '<button class="btn" id="scGo">Scan network</button><div class="prog" id="scProg"><i></i></div><div class="found" id="scRes"></div>' +
    '<label class="lab" for="scIp">Add by IP address</label><div class="fld"><input id="scIp" placeholder="192.168.1.42" inputmode="decimal" spellcheck="false" autocomplete="off"><button class="btn sm" id="scAdd">Add</button></div>',
    b => {
      const go = b.querySelector('#scGo'), res = b.querySelector('#scRes'), bar = b.querySelector('#scProg i');
      go.onclick = async () => {
        const base = b.querySelector('#scBase').value.trim();
        if (!/^\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(base)) { toast('Enter the first three numbers, like 192.168.1'); return; }
        const token = ++scanToken;
        go.textContent = 'Scanning…'; go.disabled = true; res.innerHTML = ''; bar.style.width = '0';
        let idx = 1, done = 0, found = 0;
        const worker = async () => {
          while (idx <= 254 && token === scanToken) {
            const ip = base + '.' + (idx++);
            const ok = await probe(ip, 1400);
            done++; if (token === scanToken) bar.style.width = (done / 254 * 100) + '%';
            if (ok && token === scanToken) {
              found++;
              const r = document.createElement('button');
              r.className = 'row'; r.innerHTML = '<span class="st"><b>LG TV</b><small>' + esc(ip) + '</small></span>' + ic('right', 'tail');
              r.onclick = () => addTV(ip);
              res.appendChild(r);
            }
          }
        };
        await Promise.all(Array.from({ length: 48 }, worker));
        if (token !== scanToken) return;
        go.textContent = 'Scan again'; go.disabled = false;
        if (!found) res.innerHTML = '<p class="empty">No TVs found on ' + esc(base) + '.x. Check the network or add the TV by IP.</p>';
      };
      const add = () => {
        const ip = b.querySelector('#scIp').value.trim();
        if (!validIP(ip)) { toast('Enter a valid IP address'); return; }
        addTV(ip);
      };
      b.querySelector('#scAdd').onclick = add;
      b.querySelector('#scIp').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
    });
}

/* ---------- Boot ---------- */
renderAll();
const first = findTV(S.sel);
if (S.auto && first && first.key) { go('remote'); connectTV(first); }
else go('welcome');
})();
</script>
</body>
</html>
